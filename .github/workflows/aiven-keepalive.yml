name: Keep Aiven active

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query database health endpoint
        env:
          KEEPALIVE_SECRET: ${{ secrets.KEEPALIVE_SECRET }}
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $KEEPALIVE_SECRET" \
            "$KEEPALIVE_URL/api/health"
