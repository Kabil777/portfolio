services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_USER: portfolio
    ports:
      - "5433:5432"
    volumes:
      - portfolio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio-postgres:
